<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <!-- Navigation Bar -->
  <nav>
    <a href="#story">Our Story</a>
    <a href="#services">Services & Menu</a>
    <a href="#calculator">Estimate Cost</a>
    <a href="#booking">Book Wash & Table</a>
    <a href="#contact">Contact & Map</a>
  </nav> 
   <!-- Booking Form Section -->
    <section id="booking">
      <h2 class="section-title">Book Your Wash & Reserve a Table</h2>
      <form onsubmit="handleBooking(event)">
        <div class="form-group">
          <label for="name">Full Name</label>
          <input type="text" id="name" required placeholder="e.g. Sipho Ndlovu">
        </div>
        <div class="form-group">
          <label for="phone">Phone Number</label>
          <input type="tel" id="phone" required placeholder="082 123 4567">
        </div>
        <div class="form-group">
          <label for="wash-type">Select Wash Package</label>
          <select id="wash-type">
            <option value="none">None (Shisanyama Only)</option>
            <option value="express">Express Wash & Go (R70)</option>
            <option value="underbody">Underbody Wash & Polish (R110)</option>
            <option value="executive">Full Executive Valet (R150)</option>
            <option value="detail">Interior Leather & Steam Detail (R280)</option>
          </select>
        </div>
        <div class="form-group">
          <label for="food-order">Select Shisanyama Order</label>
          <select id="food-order">
            <option value="none">None (Car Wash Only)</option>
            <option value="single">Single Braai Platter (R95)</option>
            <option value="wings">Braai Wings & Chips Platter (R120)</option>
            <option value="chopwors">Chop & Wors Combo (R140)</option>
            <option value="combo">Full Combo Feast (R240)</option>
            <option value="family">Family Sharing Board (R450)</option>
          </select>
        </div>
        <div class="form-group">
          <label for="date-time">Arrival Date & Time</label>
          <input type="datetime-local" id="date-time" required>
        </div>
        <button type="submit" class="btn" style="width: 100%;">Confirm Booking ➔</button>
      </form>
    </section>
</body>
</html>
